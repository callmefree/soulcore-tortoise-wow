name: soulcore-weekly-build

# 主服构建: 服务器为 Ubuntu, 只跑 Linux 编译。
# 采用 PlayerBots 分支的构建配置: BUILD_PLAYERBOTS=ON + ccache + strip + 240min 超时。
# 保留 lua-lint 语法门禁与 smoke-test 冒烟测试(验证 Lua 引擎/脚本加载)。

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: soulcore-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    # 显式超时: 免费 runner 默认 6h 但冷缓存全量编译需 3-5h,
    # 设 240min 让成功完成的 job 能落地 ccache 缓存, 避免每次都冷编
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ccache \
            libace-dev libssl-dev libbz2-dev zlib1g-dev \
            libreadline-dev default-libmysqlclient-dev \
            libboost-dev libboost-thread-dev libboost-filesystem-dev libboost-system-dev
          ccache --version | head -1

      - name: Ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu22-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu22-${{ github.ref_name }}-
            ccache-ubuntu22-

      - name: Configure
        env:
          # 提高缓存容量上限 (GitHub cache 上限 10GB)
          CCACHE_MAXSIZE: 8G
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SCRIPTS=ON \
            -DUSE_EXTRACTORS=OFF \
            -DALLOW_TURTLE_ADDONS=ON \
            -DUSE_PCH=ON \
            -DBUILD_PLAYERBOTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j4
          echo "--- ccache stats ---"
          ccache -s

      - name: Package
        run: |
          VERSION=$(git rev-parse --short HEAD)
          mkdir -p dist/bin dist/etc dist/sql
          # Linux 构建:二进制输出在 build/ 下(源码根 bin/ 仅 WIN32 分支生效)
          cp build/src/mangosd/mangosd build/src/realmd/realmd dist/bin/
          # strip 调试符号: Linux 静态链接产物符号表占体积 50%+,
          # strip 后 mangosd 从 ~1.5GB 缩到 ~300-400MB, 运行无影响
          strip -s dist/bin/mangosd dist/bin/realmd
          # configure 生成的 conf.dist 在 build/ 下
          find build -name "*.conf.dist" -exec cp {} dist/etc/ \;
          # 源码 .in 模板无占位符,直接改名兜底(mangosd/mods/rate/realmd)
          find src -name "*.conf.dist.in" -exec sh -c 'cp "$1" "dist/etc/$(basename "$1" .in)"' _ {} \;
          cp -r sql/* dist/sql/ 2>/dev/null || true
          # Eluna 脚本随产物发布
          cp -r lua_scripts dist/bin/ 2>/dev/null || true
          tar czf soulcore-tortoise-wow-$VERSION.tar.gz dist
          ls -lh dist/bin/ soulcore-tortoise-wow-$VERSION.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulcore-tortoise-wow
          path: soulcore-tortoise-wow-*.tar.gz
          retention-days: 14

  # ── Lua 语法门禁 ──────────────────────────────────────────────
  # 独立轻量 job: 任何 push/PR 时快速检查 lua_scripts 语法, 防止 Lua 脚本语法错误上线
  lua-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Lua syntax check (luac -p)
        run: |
          set -e
          FAIL=0
          COUNT=0
          while IFS= read -r f; do
            COUNT=$((COUNT+1))
            echo "Checking: $f"
            if ! luac5.2 -p "$f"; then
              echo "::error::SYNTAX ERROR in $f"
              FAIL=1
            fi
          done < <(find lua_scripts -name '*.lua' -type f | sort)
          echo "Checked $COUNT Lua files"
          if [ $FAIL -ne 0 ]; then
            echo "::error::Lua syntax check FAILED"
            exit 1
          fi
          echo "All Lua scripts passed syntax check"

  # ── 冒烟测试 ──────────────────────────────────────────────────
  # 依赖 build 产物: 初始化四库 + 启动 realmd 验证认证端口 + 启动 mangosd 验证 Lua 引擎/脚本加载
  # 说明: CI 无地图文件(受版权保护), mangosd 验证到 Lua 加载阶段即可, 不要求 World server up
  smoke-test:
    needs: build
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: soulcore-tortoise-wow

      - name: Extract artifact
        run: |
          tar xzf soulcore-tortoise-wow-*.tar.gz
          ls -la dist/bin/

      - name: Init databases
        run: |
          # 等待数据库就绪
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "Database ready"
              break
            fi
            sleep 2
          done
          # 建四库 (create_databases.sql 自带 CREATE DATABASE + USE)
          mysql -h127.0.0.1 -uroot -proot < dist/sql/create_databases.sql
          # 导入 base 表结构到 tw_world
          for f in dist/sql/base/tw_world_*.sql; do
            echo "Importing $(basename $f)"
            mysql -h127.0.0.1 -uroot -proot tw_world < "$f"
          done
          # 导入 database_updates
          for f in dist/sql/database_updates/*_world.sql; do
            echo "Importing $(basename $f)"
            mysql -h127.0.0.1 -uroot -proot tw_world < "$f"
          done
          echo "Database init done"

      - name: Configure conf
        run: |
          # 生成 mangosd.conf
          cp dist/etc/mangosd.conf.dist dist/etc/mangosd.conf
          sed -i 's|LoginDatabase.Info = .*|LoginDatabase.Info = "127.0.0.1;3306;root;root;tw_logon"|' dist/etc/mangosd.conf
          sed -i 's|WorldDatabase.Info = .*|WorldDatabase.Info = "127.0.0.1;3306;root;root;tw_world"|' dist/etc/mangosd.conf
          sed -i 's|CharacterDatabase.Info = .*|CharacterDatabase.Info = "127.0.0.1;3306;root;root;tw_char"|' dist/etc/mangosd.conf
          sed -i 's|LogsDatabase.Info = .*|LogsDatabase.Info = "127.0.0.1;3306;root;root;tw_logs"|' dist/etc/mangosd.conf
          # 生成 realmd.conf
          cp dist/etc/realmd.conf.dist dist/etc/realmd.conf
          sed -i 's|LoginDatabase.Info = .*|LoginDatabase.Info = "127.0.0.1;3306;root;root;tw_logon"|' dist/etc/realmd.conf
          # 关闭自动更新 (CI 已手动导入)
          sed -i 's|Database.AutoUpdate.Enabled = 1|Database.AutoUpdate.Enabled = 0|' dist/etc/mangosd.conf
          echo "Conf configured"

      - name: Smoke test realmd
        run: |
          cd dist/bin
          ./realmd -c ../etc/realmd.conf > /tmp/realmd.log 2>&1 &
          REALMD_PID=$!
          sleep 8
          if kill -0 $REALMD_PID 2>/dev/null; then
            echo "realmd alive (pid $REALMD_PID)"
          else
            echo "::error::realmd exited early"
            cat /tmp/realmd.log
            exit 1
          fi
          ss -tlnp | grep 3724 || { echo "::error::port 3724 not listening"; cat /tmp/realmd.log; exit 1; }
          echo "realmd smoke test PASSED"
          kill $REALMD_PID 2>/dev/null || true

      - name: Smoke test mangosd (Lua engine + scripts)
        run: |
          cd dist/bin
          # mangosd 对 stdin EOF 敏感, 用 </dev/null 避免立即退出
          timeout 90 ./mangosd -c ../etc/mangosd.conf < /dev/null > /tmp/mangosd.log 2>&1 &
          MANGO_PID=$!
          sleep 20
          # 检查 Lua 引擎加载 (CI 无地图文件, 验证到 Lua 加载阶段即可)
          if grep -q "Loading Lua engine" /tmp/mangosd.log; then
            echo "Lua engine loaded"
          else
            echo "::error::Lua engine not loaded"
            cat /tmp/mangosd.log
            exit 1
          fi
          if grep -qE "Loaded [0-9]+ Lua scripts" /tmp/mangosd.log; then
            echo "Lua scripts loaded"
          else
            echo "::error::Lua scripts not loaded"
            cat /tmp/mangosd.log
            exit 1
          fi
          echo "mangosd smoke test PASSED (Lua engine + scripts verified)"
          kill $MANGO_PID 2>/dev/null || true
